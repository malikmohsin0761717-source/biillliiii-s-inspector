name: Biillliiii Inspector CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, cloud-full-app-parity]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Syntax and static checks
        run: npm run check
      - name: Full test suite
        run: npm test
